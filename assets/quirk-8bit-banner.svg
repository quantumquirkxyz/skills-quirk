    <path d="M72 172L120 172L120 148L168 148L168 124L216 124L216 148L264 148L264 172L312 172L312 148L360 148L360 124L408 124L408 148L456 148L456 172L504 172L504 148L552 148L552 124L600 124L600 148L648 148L648 172L696 172L696 148L744 148L744 124L792 124L792 148L840 148L840 172L888 172L888 148L936 148L936 124L984 124L984 148L1032 148L1032 172L1080 172L1080 148L1128 148L1128 172" stroke="url(#g)" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="0" y="174" width="1200" height="6" fill="#22c55e" opacity="0.8">
