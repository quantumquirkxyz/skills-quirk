<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quirk Skills 8-bit animated banner">
  <rect width="1200" height="260" fill="#020617"/>
