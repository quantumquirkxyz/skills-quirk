    </rect>
    <rect x="126" y="114" width="16" height="16" fill="#facc15">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <rect x="1020" y="62" width="92" height="92" fill="#0f172a" stroke="#facc15" stroke-width="4"/>
    <rect x="1044" y="86" width="14" height="14" fill="#facc15">
      <animate attributeName="y" values="86;90;86" dur="1.6s" repeatCount="indefinite"/>
