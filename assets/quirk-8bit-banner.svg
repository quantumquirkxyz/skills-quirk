<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quirk Skills 8-bit animated banner">
  <rect width="1200" height="240" fill="#020617"/>
  <rect x="8" y="8" width="1184" height="224" rx="0" fill="none" stroke="#334155" stroke-width="4" shape-rendering="crispEdges"/>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0;600;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;600;1200" dur="10s" repeatCount="indefinite"/>
