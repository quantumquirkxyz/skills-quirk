name: External Release Readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/external-readiness.yml"
      - ".github/workflows/release.yml"
      - "package.json"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          registry-url: "https://registry.npmjs.org"
      - name: Initialize readiness report
        shell: bash
        run: |
          mkdir -p .skill-sandbox/readiness
          printf '{"schemaVersion":1,"npm":"NOT RUN"}\n' > .skill-sandbox/readiness/report.json
      - name: Validate npm publication credential without publishing
        id: npm
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; npm publication remains NOT RUN."
            exit 0
          fi
          npm whoami >/dev/null
          node -e "const fs=require('fs'); const p='.skill-sandbox/readiness/report.json'; const j=JSON.parse(fs.readFileSync(p)); j.npm='PASS'; fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
      - name: Record invalid npm credential
        if: steps.npm.outcome == 'failure'
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p='.skill-sandbox/readiness/report.json'; const j=JSON.parse(fs.readFileSync(p)); j.npm='FAIL'; fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
      - name: Print bounded readiness status
        if: always()
        run: cat .skill-sandbox/readiness/report.json
      - name: Upload external readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-readiness
          path: .skill-sandbox/readiness/report.json
          retention-days: 30
