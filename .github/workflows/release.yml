name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Verify tag and package versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$file_version"
          test "$package_version" = "$tag_version"
      - name: Run full test suite
        run: npm test
      - name: Run full repository gate
        run: node .agents/skills/platform/check-all.mjs
      - name: Verify priority/high-risk eval coverage
        run: node --test tests/priority-eval-coverage.test.mjs tests/high-risk-eval-coverage.test.mjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "quirk Skills ${GITHUB_REF_NAME}"
