name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Verify tag and package versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$file_version"
          test "$package_version" = "$tag_version"
      - name: Run full test suite
        run: npm test
      - name: Run full repository gate (incl. site drift, scorer, prompt regression)
        run: node .agents/skills/platform/check-all.mjs
      - name: Verify site drift (skills-to-site consistency)
        run: node scripts/generate-site-data.mjs --check
      - name: Verify quality scorer domain consistency
        run: node .agents/skills/platform/quality-scorer.mjs --json .agents/skills/ | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(r.total>=60?'PASS':'FAIL'); process.exit(r.total<60?1:0)"
      - name: Verify prompt regression tests
        run: |
          GOLDEN_DIR=.agents/skills/platform/golden
          tested=0
          for golden in "$GOLDEN_DIR"/*-v2.md; do
            [ -f "$golden" ] || continue
            skill=$(basename "$golden" -v2.md)
            tested=$((tested + 1))
            echo "Testing $skill..."
            node .agents/skills/platform/scripts/test-prompt-regression.mjs "$skill" v2 || exit 1
          done
          if [ "$tested" -eq 0 ]; then
            echo "No golden prompt files (*-v2.md) found; nothing to test."
          else
            echo "All prompt regression tests passed ($tested skills)"
          fi
      - name: Verify install script hash
        run: |
          expected_sha="$(sha256sum scripts/setup-quirk-skills.sh | cut -d' ' -f1)"
          actual_sha="$(sha256sum scripts/setup-quirk-skills.sh | cut -d' ' -f1)"
          test "$expected_sha" = "$actual_sha"
      - name: Log check results and version info
        run: |
          echo "=== Release Check Results ==="
          echo "Commit SHA: $(git rev-parse HEAD)"
          echo "Tag: ${GITHUB_REF_NAME}"
          echo "Version: $(node -p "require('./package.json').version")"
          echo "=== End ==="
      - name: Create GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "quirk Skills ${GITHUB_REF_NAME}"
          echo "Release created successfully for ${GITHUB_REF_NAME}"
