name: Engineering Source Snapshot
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/engineering-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked repository sources
        run: git archive --format=tar HEAD | gzip -9 > engineering-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-source-snapshot
          path: engineering-source.tar.gz
          retention-days: 1
