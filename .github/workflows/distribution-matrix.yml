name: Portable Distribution Matrix

on:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "scripts/**"
      - ".agents/skills/platform/sync-bundle.mjs"
      - "package.json"
      - "tests/portable-adoption-pilots.test.mjs"
      - ".github/workflows/distribution-matrix.yml"
  pull_request:
    paths:
      - "bin/**"
      - "scripts/**"
      - ".agents/skills/platform/sync-bundle.mjs"
      - "package.json"
      - "tests/portable-adoption-pilots.test.mjs"
      - ".github/workflows/distribution-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Package and adopt on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package and install into consumer
        run: npm run package:verify
      - name: Verify native path and repeat adoption fixtures
        run: node --test tests/portable-adoption-pilots.test.mjs
      - name: Verify managed upgrade backup and uninstall lifecycle
        run: node --test tests/managed-adoption-lifecycle.test.mjs
