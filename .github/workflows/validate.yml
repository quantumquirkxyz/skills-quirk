name: Validate Skills Bundle
on:
  push:
    paths:
      - ".agents/skills/**/*"
      - "evals/**/*"
      - "tests/**/*"
      - "skills-lock.json"
      - "registry.yaml"
      - "skills.json"
      - "plugins/**"
  pull_request:
    paths:
      - ".agents/skills/**/*"
      - "evals/**/*"
      - "tests/**/*"
      - "skills-lock.json"
      - "registry.yaml"
      - "skills.json"
      - "plugins/**"
  workflow_dispatch:

env:
  SKILLS_DIR: ".agents/skills"
  SANDBOX_DIR: ".skill-sandbox"

jobs:
  validate:
    name: Validate Skills Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$SANDBOX_DIR"
          echo "{}" > "$SANDBOX_DIR/manifest.json"

      - name: Run full local gate
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          node .agents/skills/platform/check-all.mjs 2>&1 | tee "$(mktemp)"

      - name: Check node lint
        run: |
          cd "$GITHUB_WORKSPACE"
          bash -n .agents/skills/delivery/diagnosing-bugs/scripts/hitl-loop.template.sh

      - name: Sync registry projections
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          node scripts/sync-registry.mjs --write 2>&1 | tee "$(mktemp)"

      - name: Generate metrics
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          node .agents/skills/platform/skill-lab.mjs metrics 2>&1 | tee "$(mktemp)"

      - name: Generate skill graph
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          node .agents/skills/platform/skill-lab.mjs graph --format mermaid 2>&1 | tee "$(mktemp)"

      - name: Quality score gate
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          node .agents/skills/platform/quality-scorer.mjs .agents/skills/skill-dev/skill-creator --minimum-score 60 2>&1 | tee "$(mktemp)"

      - name: Security scan
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          node .agents/skills/platform/security-scanner.mjs .agents/skills/skill-dev/skill-creator --json 2>&1 | tee "$(mktemp)"

      - name: Generate site data
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          node scripts/generate-site-data.mjs --write 2>&1 | tee "$(mktemp)"

      - name: Verify registry.yaml schema
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          node -e "const fs=require('fs');let r;try{r=JSON.parse(fs.readFileSync('registry.yaml','utf8'))}catch(e){console.error('registry.yaml unparseable:',e.message);process.exit(1)}console.log('registry.yaml valid:',JSON.stringify(r.name))" 2>&1 | tee "$(mktemp)"

      - name: Verify plugins structure
        run: |
          cd "$GITHUB_WORKSPACE"
          for plugin in plugins/*; do
            if [ -d "$plugin/.claude-plugin" ]; then
              echo "Plugin: $(basename $plugin)"
              test -f "$plugin/.claude-plugin/plugin.json" && echo "  plugin.json: OK" || echo "  plugin.json: MISSING"
            fi
          done

      - name: Summary
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "Skills bundle validation complete."
          echo "You can find the detailed validation report in the job summary."
