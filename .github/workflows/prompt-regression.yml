name: Prompt Regression Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-prompts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run prompt regression tests
        run: |
          GOLDEN_DIR=.agents/skills/platform/golden
          # Iterate only over skills that have a golden PROMPT file (*-v2.md).
          # Skills whose golden is an execution trace (*-v2.json) are skipped,
          # because comparing the live prompt against a JSON trace yields 0% similarity.
          tested=0
          for golden in "$GOLDEN_DIR"/*-v2.md; do
            [ -f "$golden" ] || continue
            skill=$(basename "$golden" -v2.md)
            tested=$((tested + 1))
            echo "Testing $skill..."
            node .agents/skills/platform/scripts/test-prompt-regression.mjs "$skill" v2 || exit 1
          done
          if [ "$tested" -eq 0 ]; then
            echo "No golden prompt files (*.md) found; nothing to test."
          else
            echo "All prompt regression tests passed ($tested skills)"
          fi
