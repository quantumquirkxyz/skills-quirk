name: Live Behavioral A-B Evaluation

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Behavioral fixture path"
        required: true
        default: "evals/behavioral/to-spec.json"
        type: string
      trials:
        description: "Trials per arm (minimum 3)"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Validate live evaluation plan without network
        run: node evals/harness/run-ab.mjs --fixture "${{ inputs.fixture }}" --trials "${{ inputs.trials }}" --dry-run --json

  live:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Require external model credential
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not configured; live A/B evidence cannot be fabricated."
            exit 1
          fi
      - name: Run isolated with-skill versus baseline sessions
        run: |
          mkdir -p evals/results/harness
          node evals/harness/run-ab.mjs             --fixture "${{ inputs.fixture }}"             --trials "${{ inputs.trials }}"             --judge             --out evals/results/harness
      - name: Upload A-B transcripts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ab-${{ github.run_id }}
          path: evals/results/harness/**
          retention-days: 90
