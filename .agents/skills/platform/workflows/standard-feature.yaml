name: standard-feature
description: Canonical flow for new feature work from clarification to validated delivery
entryPoint: ask-to
version: "2.0"

context:
  review:
    standardsFindings: 0
    specFindings: 0
  gateCI: "pending"
  architecture: "missing"
  refinement: "pending"
  engineeringPreflight: "missing"
  trunk: "pending"
  releaseApproval: "pending"
  loopIterations: 0
  maxIterations: 5

states:
  ask-to:
    type: router
    description: Route to the next correct step when routing is ambiguous
    transitions:
      AMBIGUOUS: grill-with-docs
      CLEAR_SPEC: engineering-preflight
      BUG: bug-fix
      NEW_PROJECT: project-development
      VIABILITY_CHECK: project-viability
      LARGE_EFFORT: wayfinder
      MONITORING: observability
      SOFTWARE_CHANGE: engineering-preflight
      DOCUMENTATION_ONLY: documentation-only
      RESEARCH_ONLY: research-only

  engineering-preflight:
    type: gate
    description: Require a current EngineeringPreflightArtifact before software-changing work
    artifactType: EngineeringPreflightArtifact
    transitions:
      APPROVED: grill-with-docs
      NOT_APPLICABLE_APPROVED: grill-with-docs
      CLEAR_SPEC_APPROVED: to-spec
      SHARP_ENOUGH: grill-with-docs
      STALE: escalate
      BLOCKED: escalate
      MISSING: escalate
    guards:
      APPROVED: engineeringPreflight == "approved"
      NOT_APPLICABLE_APPROVED: engineeringPreflight == "not-applicable"

  grill-with-docs:
    type: interview
    description: Sharpen plans through structured interview and update durable docs
    maxIterations: 6
    transitions:
      SHARP_ENOUGH: automatic-refinement
      BLOCKED: escalate
      AMBIGUOUS: ask-to

  automatic-refinement:
    type: orchestrator
    description: Apply bounded refinement before architecture and specification handoff
    artifactType: refinement
    transitions:
      REFINED: architecture-design
      REFINED_NOT_APPLICABLE: architecture-design
      SKIPPED: escalate
      BLOCKED: escalate

  architecture-design:
    type: evaluator
    description: Produce an architecture/design handoff or explicitly approved not-applicable decision
    artifactType: architecture-or-design
    transitions:
      APPROVED: to-spec
      NOT_APPLICABLE_APPROVED: to-spec
      MISSING: escalate
      BLOCKED: escalate
    guards:
      APPROVED: architecture == "approved"
      NOT_APPLICABLE_APPROVED: architecture == "not-applicable-approved"

  to-spec:
    type: artifact-writer
    description: Convert conversation into a published specification
    artifactType: spec
    transitions:
      PUBLISHED: to-tickets
      MISSING_INPUT: grill-with-docs
      BLOCKED: escalate

  to-tickets:
    type: artifact-writer
    description: Split spec into tracer-bullet tickets with blocking edges
    artifactType: tickets
    transitions:
      APPROVED: frontier
      FLEET_APPROVED: dispatch-mode
      NEEDS_SPLIT: to-tickets
      BLOCKED: escalate
    guards:
      APPROVED: (engineeringPreflight == "approved" || engineeringPreflight == "not-applicable")
      FLEET_APPROVED: (engineeringPreflight == "approved" || engineeringPreflight == "not-applicable")

  dispatch-mode:
    type: router
    description: Choose sequential implementation or an explicitly approved parallel issue fleet
    transitions:
      SEQUENTIAL: frontier
      PARALLEL_FLEET: parallel-issue-fleet
      BLOCKED: escalate

  parallel-issue-fleet:
    type: orchestrator
    description: Dispatch the claimable DAG wave with isolated workers, durable checkpoints, bounded concurrency, and cleanup
    artifactType: fleet-run
    transitions:
      WAVE_VALIDATED: fleet-wave-publication
      COMPLETED: publish-open-pr
      BLOCKED: escalate

  fleet-wave-publication:
    type: orchestrator
    description: Publish, review, and land every validated branch before dependent waves start
    loop:
      - publish-open-pr
      - review-pr
      - ship-subissue
    transitions:
      WAVE_LANDED: parallel-issue-fleet
      ALL_DONE: done
      BLOCKED: escalate

  frontier:
    type: dispatcher
    description: Dispatch the next claimable ticket to implement
    transitions:
      NEXT_READY: implement
      ALL_DONE: ship-subissue
      BLOCKED: escalate

  implement:
    type: executor
    description: Implement work from spec or ticket with TDD and quality gates
    modelTier: code
    transitions:
      VALIDATED: publish-open-pr
      FAILED: implement
      MISSING_PREFLIGHT: engineering-preflight
      BLOCKED: escalate
    guards:
      VALIDATED: refinement == "completed" && architecture in ["approved", "not-applicable-approved"] && (engineeringPreflight == "approved" || engineeringPreflight == "not-applicable")

  publish-open-pr:
    type: artifact-writer
    description: Open pull request from issue branch with validation evidence
    artifactType: pull-request
    transitions:
      OPENED: trunk-based-guard
      FAILED: implement
      MISSING_PREFLIGHT: engineering-preflight
    guards:
      OPENED: gateCI == "passed" && (engineeringPreflight == "approved" || engineeringPreflight == "not-applicable")

  trunk-based-guard:
    type: gate
    description: Validate branch age, PR size, green CI, merge strategy, and cleanup before merge
    artifactType: trunk-based-workflow
    transitions:
      PASSED: review-pr
      FAILED: escalate
    guards:
      PASSED: trunk == "passed"

  review-pr:
    type: reviewer
    description: Review PR against Standards and Spec axes via parallel sub-agents
    axes: [Standards, Spec]
    parallelSubAgents: true
    transitions:
      CLEAN: ship-subissue
      FINDINGS: review-fix-loop
      CONFLICT: resolving-merge-conflicts
    guards:
      CLEAN: review.standardsFindings == 0 && review.specFindings == 0
      FINDINGS: loopIterations < maxIterations

  review-fix-loop:
    type: orchestrator
    description: Orchestrate repair cycle until PR is clean or blocked
    loop:
      - plan-review-fixes
      - implement-review-fixes
      - review-pr
    maxIterations: 5
    transitions:
      CLEAN: ship-subissue
      BLOCKED: escalate
      CONFLICT: resolving-merge-conflicts

  resolving-merge-conflicts:
    type: resolver
    description: Resolve merge/rebase conflicts before continuing review
    transitions:
      RESOLVED: review-pr
      BLOCKED: escalate

  ship-subissue:
    type: publisher
    description: Merge clean PR, close linked issue, update tracker
    transitions:
      MERGED: release-management
      FAILED: review-pr
      MISSING_PREFLIGHT: engineering-preflight

  release-management:
    type: gate
    description: Approve an immutable release candidate with provenance, rollback, canary, and CI evidence
    artifactType: release-candidate
    transitions:
      APPROVED: deployment
      REJECTED: escalate
      BLOCKED: escalate
    guards:
      APPROVED: releaseApproval == "approved"
      REJECTED: releaseApproval == "rejected"

  deployment:
    type: executor
    description: Promote the approved release candidate using the deployment strategy
    transitions:
      DEPLOYED: observability
      FAILED: release-management
      BLOCKED: escalate

  escalate:
    type: terminal
    description: Stop with explicit escalation report

  done:
    type: terminal
    description: Flow complete

  bug-fix:
    type: router
    description: Entry point for bug fix flow
    transitions:
      DIAGNOSED: tdd
      NEEDS_DIAGNOSIS: diagnosing-bugs
      BLOCKED: escalate

  project-development:
    type: evaluator
    description: Evaluate project shape, stack, and architectural starting point
    transitions:
      SHAPED: ask-to
      BLOCKED: escalate

  project-viability:
    type: evaluator
    description: Assess project health, architecture, and scalability
    transitions:
      VIABLE: ask-to
      NOT_VIABLE: escalate

  wayfinder:
    type: planner
    description: Plan large effort as map of decision tickets on issue tracker
    transitions:
      PLANNED: ask-to
      BLOCKED: escalate

  observability:
    type: designer
    description: Define logs, metrics, traces, alerts, SLIs, SLOs
    transitions:
      DEFINED: sre
      BLOCKED: escalate

  sre:
    type: observer
    description: Verify post-deployment health, SLOs, and rollback signals
    transitions:
      VERIFIED: done
      DEGRADED: escalate
