name: operations
description: Continuous release, deployment, and monitoring flow
entryPoint: engineering-preflight
version: "2.0"

context:
  gateCI: "pending"
  engineeringPreflight: "missing"

states:
  engineering-preflight:
    type: gate
    description: Require a current EngineeringPreflightArtifact before operational software changes
    artifactType: EngineeringPreflightArtifact
    transitions:
      APPROVED: release-management
      NOT_APPLICABLE_APPROVED: release-management
      STALE: escalate
      BLOCKED: escalate
      MISSING: escalate
    guards:
      APPROVED: engineeringPreflight == "approved"
      NOT_APPLICABLE_APPROVED: engineeringPreflight == "not-applicable"

  release-management:
    type: planner
    description: Plan the release train and CI handoff
    transitions:
      PLANNED: deployment
      MISSING_PREFLIGHT: engineering-preflight
      BLOCKED: escalate

  deployment:
    type: executor
    description: Define build, release, and rollback seam
    modelTier: code
    transitions:
      DEPLOYED: observability
      FAILED: deployment
      MISSING_PREFLIGHT: engineering-preflight
      ROLLED_BACK: release-management
    guards:
      DEPLOYED: gateCI == "passed"

  observability:
    type: designer
    description: Define logs, metrics, traces, alerts, SLIs, SLOs
    transitions:
      DEFINED: observability-monitor
      NEEDS_UPDATE: observability

  observability-monitor:
    type: monitor
    description: Monitor production and manage alerts
    transitions:
      ALERT: incident-response
      HEALTHY: observability
      DEGRADED: incident-response

  incident-response:
    type: responder
    description: Run incident response: war rooms, runbooks, postmortems
    transitions:
      RESOLVED: observability
      ESCALATED: escalate

  escalate:
    type: terminal

  done:
    type: terminal
