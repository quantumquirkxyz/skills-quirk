name: repair
description: Review-repair cycle for PRs with findings
entryPoint: engineering-preflight
version: "2.0"

context:
  review:
    standardsFindings: 0
    specFindings: 0
  loopIterations: 0
  maxIterations: 5
  engineeringPreflight: "missing"

states:
  engineering-preflight:
    type: gate
    description: Require a current EngineeringPreflightArtifact before review-repair work
    artifactType: EngineeringPreflightArtifact
    transitions:
      APPROVED: plan-review-fixes
      NOT_APPLICABLE_APPROVED: plan-review-fixes
      STALE: escalate
      BLOCKED: escalate
      MISSING: escalate
    guards:
      APPROVED: engineeringPreflight == "approved"
      NOT_APPLICABLE_APPROVED: engineeringPreflight == "not-applicable"

  plan-review-fixes:
    type: planner
    description: Convert review findings into concrete remediation plan
    transitions:
      PLANNED: implement-review-fixes
      BLOCKED: escalate

  implement-review-fixes:
    type: executor
    description: Apply planned corrections
    modelTier: code
    transitions:
      FIXED: review-pr
      FAILED: implement-review-fixes
      MISSING_PREFLIGHT: engineering-preflight
      BLOCKED: escalate

  review-pr:
    type: reviewer
    axes: [Standards, Spec]
    parallelSubAgents: true
    transitions:
      CLEAN: ship-subissue
      FINDINGS: plan-review-fixes
      CONFLICT: resolving-merge-conflicts
    guards:
      CLEAN: review.standardsFindings == 0 && review.specFindings == 0
      FINDINGS: loopIterations < maxIterations

  resolving-merge-conflicts:
    type: resolver
    transitions:
      RESOLVED: review-pr
      BLOCKED: escalate

  ship-subissue:
    type: publisher
    transitions:
      MERGED: done
      FAILED: review-pr
      MISSING_PREFLIGHT: engineering-preflight

  escalate:
    type: terminal

  done:
    type: terminal
