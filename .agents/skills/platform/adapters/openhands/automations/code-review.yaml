name: code-review
description: "Analyze a repository or requested code scope for logical correctness, behavior, architecture, risks, and maintainability, returning evidence-backed findings without editing source files."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-code-review
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [post-pr-comment]
