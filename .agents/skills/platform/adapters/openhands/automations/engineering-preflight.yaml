name: engineering-preflight
description: Establish the mandatory engineering traceability gate before any work that changes software.
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/engineering-engineering-preflight
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
