name: architecture-evaluation
description: "Evaluate architecture alternatives against quality attributes, constraints, cost, risk, reversibility, sustainability, and operational fit."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/engineering-architecture-evaluation
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
