name: skill-sandbox
description: "Create, test, and iterate on experimental skills inside a deny-by-default sandbox with isolation, adversarial fixtures, deterministic replay, cleanup attestation, and promotion gates."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-skill-sandbox
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [write-files, execute-processes, network-denied, create-sandbox]
