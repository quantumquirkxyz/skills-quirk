name: implement-review-fixes
description: "Apply a plan-review-fixes remediation plan through implement, validate each finding, and hand off a traceable implementation result."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/delivery-implement-review-fixes
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: [write-code, commit-git, push-branch, post-pr-comment]
