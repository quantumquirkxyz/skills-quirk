name: requirements-engineering
description: "Transform stakeholder, business, and system needs into verifiable, traceable, versioned requirements with explicit provenance, conflicts, quality gates, and change impact."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/project-requirements-engineering
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: true
  sideEffects: []
