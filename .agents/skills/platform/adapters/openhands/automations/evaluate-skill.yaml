name: evaluate-skill
description: "Evaluate a Skill with versioned baseline/candidate experiments for routing, completion, safety, artifact validity, evaluator reliability, and regression risk."
trigger:
  type: webhook
  events: [pull_request.opened, issues.opened]
runtime:
  agent: claude-code
  sandbox: docker
steps:
  - uses: skill/skill-dev-evaluate-skill
    with:
      task: "{{ event.title }}"
policy:
  approvalRequired: false
  sideEffects: []
