<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quirk Skills — Discovery</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0f; color: #e4e4e7; }
      header { background: #13131f; padding: 1.5rem 2rem; border-bottom: 1px solid #27272a; }
      h1 { font-size: 1.5rem; font-weight: 700; }
      .subtitle { color: #a1a1aa; font-size: 0.875rem; margin-top: 0.25rem; }
      .search-bar { padding: 1rem 2rem; background: #0a0a0f; border-bottom: 1px solid #27272a; }
      .search-bar input { width: 100%; padding: 0.75rem 1rem; background: #13131f; border: 1px solid #3f3f46; border-radius: 0.5rem; color: #e4e4e7; font-size: 1rem; }
      .search-bar input:focus { outline: none; border-color: #6366f1; }
      .filters { padding: 0.75rem 2rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .filter-btn { padding: 0.5rem 1rem; background: #18181b; border: 1px solid #3f3f46; border-radius: 9999px; color: #a1a1aa; cursor: pointer; font-size: 0.875rem; }
      .filter-btn:hover { background: #27272a; color: #e4e4e7; }
      .filter-btn.active { background: #6366f1; color: white; border-color: #6366f1; }
      .stats { padding: 1rem 2rem; display: flex; gap: 2rem; }
      .stat { text-align: center; }
      .stat-value { font-size: 1.5rem; font-weight: 700; color: #6366f1; }
      .stat-label { font-size: 0.75rem; color: #71717a; text-transform: uppercase; }
      .skills-grid { padding: 1.5rem 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
      .skill-card { background: #13131f; border: 1px solid #27272a; border-radius: 0.75rem; padding: 1rem; }
      .skill-card:hover { border-color: #3f3f46; }
      .skill-header { display: flex; justify-content: space-between; align-items: start; }
      .skill-name { font-size: 1.125rem; font-weight: 600; color: #fafafa; }
      .skill-path { font-size: 0.75rem; color: #71717a; font-family: monospace; }
      .skill-desc { color: #a1a1aa; font-size: 0.875rem; margin-top: 0.5rem; line-height: 1.5; }
      .skill-meta { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
      .badge { padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 500; }
      .badge-category { background: #1e1b4b; color: #818cf8; }
      .badge-tier { background: #14532d; color: #4ade80; }
      .badge-risk { background: #7c2d12; color: #fb923c; }
      .skill-actions { margin-top: 0.75rem; display: flex; gap: 0.5rem; }
      .cmd { flex: 1; padding: 0.5rem; background: #0a0a0f; border: 1px solid #27272a; border-radius: 0.375rem; font-family: monospace; font-size: 0.75rem; color: #a1a1aa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
