<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Quirk Skills animated workflow header</title>
  <desc id="description">A dark pixel-art header reading Quirk Skills and Clarify, Review, Ship, with colored workflow nodes and a segmented pipeline.</desc>
  <style>
    .crisp { shape-rendering: crispEdges; }
    .trace { stroke-dasharray: 1260; stroke-dashoffset: 1260; animation: trace-line 720ms steps(12,end) forwards; }
    .frame { stroke-dasharray: 2980; stroke-dashoffset: 2980; animation: draw-frame 1.3s 420ms steps(18,end) forwards; }
    .node { opacity:0; transform:scale(0); transform-box:fill-box; transform-origin:center; animation: node-in 180ms steps(2,end) forwards; animation-delay:calc(1.25s + var(--i) * 70ms); }
    .mark { opacity:0; transform:scale(0); transform-box:fill-box; transform-origin:center; animation: node-in 180ms steps(2,end) forwards; animation-delay:calc(1.52s + var(--i) * 55ms); }
    .wordmark { opacity:.16; transform:translateY(8px); animation: title-in 640ms 2.2s steps(8,end) forwards; }
    .subtitle { opacity:0; animation: fade-in 160ms 3.25s linear forwards; }
    .segment { opacity:.2; animation: segment-in 120ms linear forwards; animation-delay:calc(3.52s + var(--i) * 90ms); }
    .status { opacity:0; animation: fade-in 180ms 3.4s linear forwards; }
    .cursor { animation: fade-in 180ms 4.55s linear forwards; }
    .rest-node-a { animation: node-in 180ms 1.6s steps(2,end) forwards, node-breathe 4.2s 5s steps(2,end) infinite; }
    .rest-node-b { animation: node-in 180ms 1.95s steps(2,end) forwards, node-breathe 4.2s 6.1s steps(2,end) infinite; }
    @keyframes trace-line { to { stroke-dashoffset:0; } }
    @keyframes draw-frame { to { stroke-dashoffset:0; } }
    @keyframes node-in { to { opacity:1; transform:scale(1); } }
    @keyframes title-in { to { opacity:1; transform:translateY(0); } }
    @keyframes fade-in { to { opacity:1; } }
    @keyframes segment-in { to { opacity:.92; } }
    @keyframes cursor-blink { 0%,64% { opacity:1; } 65%,100% { opacity:.3; } }
    @keyframes node-breathe { 0%,72%,100% { opacity:.55; } 78%,92% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation:none!important; }
      .trace,.frame { stroke-dashoffset:0; }
      .node,.mark,.wordmark,.subtitle,.segment,.status,.cursor { opacity:1; transform:none; }
      .segment { opacity:.92; }
      #top-scanner,#pipeline-runner,#node-pulse-left,#node-pulse-right { display:none; }
    }
  </style>

  <rect width="1280" height="320" fill="#03060D"/>
  <rect x="10" y="10" width="1260" height="300" fill="#070B1B" stroke="#273449"/>

  <g opacity=".32" stroke="#171F32" class="crisp">
    <path d="M32 64H1248M32 96H1248M32 128H1248M32 160H1248M32 192H1248M32 224H1248M32 256H1248"/>
    <path d="M128 32V288M256 32V288M384 32V288M512 32V288M640 32V288M768 32V288M896 32V288M1024 32V288M1152 32V288"/>
  </g>

  <path class="trace" d="M10 10H1270" stroke="#35C5F4" stroke-width="2"/>
  <rect id="top-scanner" x="10" y="9" width="96" height="2" fill="#F3F5FA" opacity="0">
    <animate attributeName="x" values="10;83;156;229;302;375;448;521;594;667;740;813;886;959;1032;1105;1174" begin="5s" dur="6.4s" repeatCount="indefinite" calcMode="discrete"/>
    <animate attributeName="opacity" values="0;.65;.65;0" keyTimes="0;.08;.84;1" begin="5s" dur="6.4s" repeatCount="indefinite"/>
  </rect>
  <rect class="frame crisp" x="28" y="28" width="1224" height="264" stroke="#273449" stroke-width="2"/>

  <g font-family="SFMono-Regular,Consolas,Liberation Mono,Courier New,monospace" font-size="10" letter-spacing="2" fill="#8591A4">
    <text x="52" y="58">QSK / WORKFLOW SYSTEM / 03</text>
    <text x="1228" y="58" text-anchor="end">DETERMINISTIC BUILD</text>
  </g>

  <g class="crisp">
    <g transform="translate(134 102)">
      <rect class="node" style="--i:0" width="10" height="10" fill="#20C96B"/>
      <rect class="node" style="--i:1" x="22" width="10" height="10" fill="#273449"/>
      <rect class="node" style="--i:2" x="44" width="10" height="10" fill="#35C5F4"/>
      <rect class="node" style="--i:3" x="66" width="10" height="10" fill="#273449"/>
      <rect class="node" style="--i:4" y="22" width="10" height="10" fill="#273449"/>
      <rect class="node" style="--i:5" x="22" y="22" width="10" height="10" fill="#FFD21F"/>
      <rect class="node" style="--i:6" x="44" y="22" width="10" height="10" fill="#273449"/>
      <rect class="node rest-node-a" style="--i:7" x="66" y="22" width="10" height="10" fill="#20C96B"/>
      <rect class="node" style="--i:8" y="44" width="10" height="10" fill="#35C5F4"/>
      <rect class="node" style="--i:9" x="22" y="44" width="10" height="10" fill="#273449"/>
      <rect class="node" style="--i:10" x="44" y="44" width="10" height="10" fill="#FFD21F"/>
      <rect class="node" style="--i:11" x="66" y="44" width="10" height="10" fill="#273449"/>
    </g>

    <g transform="translate(1070 102) rotate(180 38 27)">
      <rect class="node" style="--i:11" width="10" height="10" fill="#20C96B"/>
      <rect class="node" style="--i:10" x="22" width="10" height="10" fill="#273449"/>
      <rect class="node" style="--i:9" x="44" width="10" height="10" fill="#35C5F4"/>
      <rect class="node" style="--i:8" x="66" width="10" height="10" fill="#273449"/>
      <rect class="node" style="--i:7" y="22" width="10" height="10" fill="#273449"/>
      <rect class="node" style="--i:6" x="22" y="22" width="10" height="10" fill="#FFD21F"/>
      <rect class="node" style="--i:5" x="44" y="22" width="10" height="10" fill="#273449"/>
      <rect class="node rest-node-b" style="--i:4" x="66" y="22" width="10" height="10" fill="#35C5F4"/>
      <rect class="node" style="--i:3" y="44" width="10" height="10" fill="#20C96B"/>
      <rect class="node" style="--i:2" x="22" y="44" width="10" height="10" fill="#273449"/>
      <rect class="node" style="--i:1" x="44" y="44" width="10" height="10" fill="#FFD21F"/>
      <rect class="node" style="--i:0" x="66" y="44" width="10" height="10" fill="#273449"/>
    </g>

    <rect id="node-pulse-left" x="200" y="124" width="10" height="10" fill="#20C96B" opacity="0">
      <animate attributeName="opacity" values="0;.9;0;0" keyTimes="0;.12;.28;1" begin="5s" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <rect id="node-pulse-right" x="1080" y="134" width="10" height="10" fill="#35C5F4" opacity="0">
      <animate attributeName="opacity" values="0;0;.9;0" keyTimes="0;.35;.5;1" begin="5s" dur="4.8s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(344 116)">
      <rect class="mark" style="--i:0" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:1" x="10" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:2" y="10" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:3" y="20" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:4" y="30" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:5" y="40" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:6" x="10" y="40" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:7" x="20" y="20" width="7" height="7" fill="#FFD21F"/>
    </g>
    <g transform="translate(936 116) scale(-1 1)">
      <rect class="mark" style="--i:0" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:1" x="10" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:2" y="10" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:3" y="20" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:4" y="30" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:5" y="40" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:6" x="10" y="40" width="7" height="7" fill="#35C5F4"/>
      <rect class="mark" style="--i:7" x="20" y="20" width="7" height="7" fill="#FFD21F"/>
    </g>
  </g>

  <g class="wordmark" font-family="SFMono-Regular,Consolas,Liberation Mono,Courier New,monospace" text-anchor="middle">
    <text x="640" y="160" fill="#171F32" font-size="58" font-weight="800" letter-spacing="3">QUIRK SKILLS</text>
    <text x="636" y="156" fill="#F3F5FA" font-size="58" font-weight="800" letter-spacing="3">QUIRK SKILLS</text>
  </g>

  <g class="subtitle" font-family="SFMono-Regular,Consolas,Liberation Mono,Courier New,monospace" font-size="14" letter-spacing="3" text-anchor="middle">
    <text x="510" y="194" fill="#20C96B">CLARIFY</text>
    <rect x="557" y="187" width="5" height="5" fill="#273449"/>
    <text x="640" y="194" fill="#35C5F4">REVIEW</text>
    <rect x="718" y="187" width="5" height="5" fill="#273449"/>
    <text x="778" y="194" fill="#FFD21F">SHIP</text>
  </g>

  <g class="crisp" transform="translate(262 242)">
    <rect class="segment" style="--i:0" width="56" height="8" fill="#20C96B"/>
    <rect class="segment" style="--i:1" x="64" width="56" height="8" fill="#20C96B"/>
    <rect class="segment" style="--i:2" x="128" width="56" height="8" fill="#20C96B"/>
    <rect class="segment" style="--i:3" x="192" width="56" height="8" fill="#20C96B"/>
    <rect class="segment" style="--i:4" x="256" width="56" height="8" fill="#35C5F4"/>
    <rect class="segment" style="--i:5" x="320" width="56" height="8" fill="#35C5F4"/>
    <rect class="segment" style="--i:6" x="384" width="56" height="8" fill="#35C5F4"/>
    <rect class="segment" style="--i:7" x="448" width="56" height="8" fill="#35C5F4"/>
    <rect class="segment" style="--i:8" x="512" width="56" height="8" fill="#FFD21F"/>
    <rect class="segment" style="--i:9" x="576" width="56" height="8" fill="#FFD21F"/>
    <rect class="segment" style="--i:10" x="640" width="56" height="8" fill="#FFD21F"/>
    <rect class="segment" style="--i:11" x="704" width="56" height="8" fill="#FFD21F"/>
    <rect id="pipeline-runner" x="0" y="-2" width="8" height="12" fill="#F3F5FA" opacity="0">
      <animate attributeName="x" values="0;64;128;192;256;320;384;448;512;576;640;704;752" begin="5s" dur="4.8s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="0;.82;.82;0" keyTimes="0;.08;.84;1" begin="5s" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="status" font-family="SFMono-Regular,Consolas,Liberation Mono,Courier New,monospace" font-size="10" letter-spacing="2" fill="#778398">
    <text x="182" y="251">EXECUTION</text>
    <text x="1035" y="251">READY</text>
    <rect class="cursor" x="1080" y="241" width="7" height="11" fill="#20C96B">
      <animate attributeName="opacity" values="1;1;.25;.25" keyTimes="0;.64;.65;1" begin="4.75s" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
