# Interview questions for skill creation.

discovery:
  - question: "What problem should this skill solve?"
    purpose: "Identify the core purpose and motivation for the skill."
    follow_up: "Give one concrete situation where someone would use this skill."

  - question: "Give three concrete examples of how a user would invoke it."
    purpose: "Capture realistic usage patterns."
    follow_up: "Which example is the most common or important?"

  - question: "What domain or area does it cover?"
    purpose: "Place the skill in a useful category."
    follow_up: "Are there subdomains or special cases the skill should handle?"

  - question: "What inputs does it receive and what outputs should it produce?"
    purpose: "Define the skill interface."
    follow_up: "Are there alternate input or output formats to support?"

  - question: "Are there existing skills that are similar?"
    purpose: "Avoid duplication and reuse established patterns."
    follow_up: "If similar skills exist, how should this one be different?"

  - question: "What specialized knowledge does it need?"
    purpose: "Identify references, constraints, dependencies, or source material."
    follow_up: "Does it require a specific database, API, documentation set, or standard?"

design:
  - question: "Based on your answers, I propose a focused architecture. Does that fit the work?"
    purpose: "Review an initial architecture before files are generated."
    follow_up: "What components would you add, remove, or change?"

  - question: "I suggest creating scripts, references, assets, and ADRs. Does that cover the needed resources?"
    purpose: "Define concrete supporting files."
    follow_up: "What other resources would make the skill easier to use or validate?"

  - question: "The workflow I imagine has discovery, execution, validation, and handoff steps. Does it make sense?"
    purpose: "Define how the skill guides the user."
    follow_up: "Which steps should be reordered, split, or removed?"

research:
  - question: "Would you like supporting research for the skill topic?"
    purpose: "Improve the design with existing patterns and quality constraints."
    follow_up: "What part of the topic should the research emphasize?"

  - question: "How should the research findings influence the skill design?"
    purpose: "Translate research into concrete decisions."
    follow_up: "Are there sources or approaches that should be weighted more heavily?"

naming:
  - question: "Which suggested name should I use, or what custom name do you prefer?"
    purpose: "Choose a stable directory and skill name."
    follow_up: "Should the name emphasize the domain, the action, or the artifact?"
